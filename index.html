<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Conversaciones — NuveraPRO</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fa;color:#0b2545;margin:0;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.list{width:360px;flex:0 0 360px;border-right:1px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;min-height:0}
.lhead{padding:12px 14px;border-bottom:1px solid #eef2f7}
.lhead h1{margin:0;font-size:17px}
.lhead .sub{color:#64748b;font-size:12px;margin-top:2px}
.search{margin:8px 0 4px}
.search input{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit}
.filt{display:flex;gap:6px;margin:6px 0 2px}
.filt button{flex:1;border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:8px;padding:7px 4px;font-size:12px;font-weight:700;cursor:pointer}
.filt button.on{background:#0b2545;color:#fff;border-color:#0b2545}
.opbar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:7px 9px;background:#0b2545;border-radius:10px;cursor:pointer}
.opbar .opav{width:26px;height:26px;border-radius:50%;flex:0 0 auto;background:#1e3a8a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;overflow:hidden}
.opbar .opav img{width:100%;height:100%;object-fit:cover}
.opbar .opn{flex:1;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opbar .opc{font-size:11px;color:#7dd3fc;font-weight:800;text-transform:uppercase}
.opmodal{position:fixed;inset:0;background:rgba(11,37,69,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.opmodal.open{display:flex}
.opsheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.opsheet h3{margin:2px 0 12px;font-size:16px}
.oprow{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;cursor:pointer}
.oprow.sel{border-color:#0ea5e9;background:#f0f9ff}
.oprow .oav{width:42px;height:42px;border-radius:50%;flex:0 0 auto;background:#0b2545;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;overflow:hidden}
.oprow .oav img{width:100%;height:100%;object-fit:cover}
.oprow .onm{flex:1;font-weight:700;font-size:15px}
.oprow .ofoto{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:#334155;cursor:pointer}
.opclose{width:100%;border:none;background:#0b2545;color:#fff;border-radius:10px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px}
.items{overflow-y:auto;flex:1;min-height:0}
.it{padding:11px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;gap:10px;align-items:flex-start;user-select:none;-webkit-user-select:none}
.it:active{background:#eef4ff}
.it.sel{background:#eef4ff}
.it.cerrada{opacity:.6}
.it.confirmrow{padding:0;cursor:default}
.rowconfirm{display:flex;align-items:center;gap:8px;width:100%;background:#eef4ff;border-top:1px solid #c7d2fe;border-bottom:1px solid #c7d2fe;padding:11px 14px}
.rowconfirm .rcq{flex:1;font-weight:700;font-size:13px;color:#1e3a8a;min-width:0}
.rcbtn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.rcbtn.yes{background:#0b2545;color:#fff;border-color:#0b2545}
.av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:#0b2545;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.it.cerrada .av{background:#94a3b8}
.it .mid{flex:1;min-width:0}
.it .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.it .pv{color:#64748b;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.it .tm{flex:0 0 auto;color:#94a3b8;font-size:11px;white-space:nowrap}
.badge{font-size:9px;font-weight:800;color:#fff;border-radius:999px;padding:1px 6px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.b-paus{background:#ea580c}.b-cerr{background:#64748b}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{padding:10px 14px;border-bottom:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;gap:10px}
.chead .back{display:none;border:none;background:#eef2f7;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:16px;color:#0b2545}
.chead .cn{flex:1;min-width:0}
.chead .cn b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .cn span{color:#64748b;font-size:12px}
.crm{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.crmrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:#f1f5f9;color:#334155;white-space:nowrap}
.chip.etapa{background:#e0e7ff;color:#3730a3}
.chip.estado{background:#dcfce7;color:#166534}
.chip.estado.warn{background:#fef9c3;color:#854d0e}.chip.estado.bad{background:#fee2e2;color:#991b1b}
.chip.mat{background:#ede9fe;color:#5b21b6}
.chip.dias{background:#fff7ed;color:#9a3412}
.crmmeta{font-size:12px;color:#475569;display:flex;flex-wrap:wrap;gap:10px}
.crmmeta a{color:#0369a1;text-decoration:none}
.iabox{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:9px 11px;margin-top:2px}
.iahead{font-size:12px;font-weight:800;color:#5b21b6;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip.iaest{background:#ede9fe;color:#5b21b6}
.iares{font-size:13px;color:#334155;margin-top:5px;line-height:1.35}
.iaprox{font-size:13px;color:#166534;background:#f0fdf4;border-radius:8px;padding:5px 8px;margin-top:6px;font-weight:600}
.iabtn{width:100%;border:1px solid #ddd6fe;background:#fff;color:#5b21b6;border-radius:10px;padding:9px;font-size:13px;font-weight:800;cursor:pointer;margin-top:6px}
.iabtn:active{background:#f5f3ff}
.actions{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
.act{flex:1;min-width:96px;border:none;border-radius:12px;padding:12px 8px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.act.call{background:#16a34a;color:#fff}
.act.wa{background:#25d366;color:#fff}
.act.notion{background:#0b2545;color:#fff;font-size:13px}
.act.notion.lead{background:#334155}
.act2{display:flex;gap:8px;padding:0 14px 10px;background:#fff;border-bottom:1px solid #e2e8f0}
.pausebtn{flex:1;border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;color:#334155}
.pausebtn.on{background:#fff7ed;border-color:#fdba74;color:#c2410c}
.closebtn{flex:1;border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer}
.reopenbtn{flex:1;border:1px solid #86efac;background:#f0fdf4;color:#15803d;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer}
.thread{flex:1;overflow-y:auto;min-height:0;padding:16px;background:#f5f7fa;display:flex;flex-direction:column;gap:8px}
.cerrbanner{align-self:center;background:#e2e8f0;color:#475569;font-size:11px;font-weight:700;border-radius:999px;padding:3px 12px;margin-bottom:4px}
.bb{max-width:78%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.bb .bt{display:block;font-size:10px;color:#94a3b8;margin-top:4px}
.bb.cli{align-self:flex-start;background:#fff;border:1px solid #e2e8f0;border-bottom-left-radius:4px}
.bb.age{align-self:flex-end;background:#dcf8c6;border-bottom-right-radius:4px}
.bb.man .bt::after{content:' · manual'}
.composer{border-top:1px solid #e2e8f0;background:#fff;padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;resize:none;max-height:120px;min-height:44px}
.composer .send{background:#16a34a;color:#fff;border:none;border-radius:12px;padding:0 18px;height:44px;font-weight:800;cursor:pointer;font-size:15px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:14px;padding:20px;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.note{font-size:11px;color:#94a3b8;padding:0 12px 8px;text-align:center}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;margin-right:3px;vertical-align:middle}
.livedot.off{background:#ea580c}
@media(max-width:720px){
  .list{width:100%;flex:1 1 auto}
  .chat{display:none;position:fixed;inset:0;z-index:10;background:#f5f7fa}
  body.chatopen .list{display:none}
  body.chatopen .chat{display:flex}
  .chead .back{display:block}
}

.nvqr{position:fixed;z-index:60;bottom:70px;left:50%;transform:translateX(-50%);width:min(560px,94%);max-height:46vh;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 10px 34px rgba(2,6,23,.20);padding:6px;display:none}
.nvqr.open{display:block}
.nvqr .nvqr-h{font-size:11px;font-weight:800;color:#64748b;padding:6px 8px}
.nvqr .nvqr-i{padding:9px 10px;border-radius:10px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.nvqr .nvqr-i:hover{background:#eef4ff}
.nvqr .nvqr-i b{font-size:13px;color:#0b2545;display:block}
.nvqr .nvqr-i span{font-size:12px;color:#64748b;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.it.nv-g{box-shadow:inset 4px 0 0 #22c55e;background:#f6fef9}
.it.nv-y{box-shadow:inset 4px 0 0 #f59e0b;background:#fffef6}
.it.nv-g.sel,.it.nv-y.sel{background:#eef4ff}
.thread.nv-g{background:#f3fdf7}
.thread.nv-y{background:#fffdf3}
.chead.nv-g{box-shadow:inset 0 3px 0 #22c55e}
.chead.nv-y{box-shadow:inset 0 3px 0 #f59e0b}
.nvpill{font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.nvpill.g{background:#dcfce7;color:#166534}
.nvpill.y{background:#fef9c3;color:#854d0e}
</style></head><body>
<div class="app">
  <div class="list">
    <div class="lhead"><h1>💬 Conversaciones</h1><div class="sub" id="sub">Cargando…</div>
      <div class="search"><input id="q" placeholder="Buscar número, nombre o texto…" autocomplete="off"></div>
      <div class="filt">
        <button data-f="abiertas" class="on" id="fAb">Abiertas</button>
        <button data-f="cerradas" id="fCe">Cerradas</button>
        <button data-f="todas" id="fTo">Todas</button>
      </div>
      <div class="opbar" id="opbar"></div>
      <div id="ausbar" style="margin-top:6px"><button id="ausbtn" style="width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#f1f5f9;color:#475569;font-weight:600;cursor:pointer;font-size:13px">🌙 Mensaje de ausencia: …</button></div>
    </div>
    <div class="items" id="items"></div>
  </div>
  <div class="chat">
    <div id="chatinner" style="display:flex;flex-direction:column;height:100%">
      <div class="empty" id="empty">Elegí una conversación para ver el hilo y la ficha del cliente.</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="opmodal" id="opmodal"><div class="opsheet" id="opsheet"></div></div>
<script>
var STATE_URL="/state";
var PAUSAR="https://n8n.entrenemos.cl/webhook/conversacion-pausar";
var RESPONDER="https://n8n.entrenemos.cl/webhook/conversacion-responder";
var CERRAR="https://n8n.entrenemos.cl/webhook/conversacion-eliminar";
var ANALIZAR="https://n8n.entrenemos.cl/webhook/analizar-conversacion";
var DATA=null, SEL=null, Q="", FILTER="abiertas", CONFIRMROW=null, CLICKT=null, PENDING_WA=null;
var LIVE=false, OUTBOX=[];
var OPS_DEF=[{k:"francisco",n:"Francisco"},{k:"matias",n:"Matías"},{k:"cristina",n:"Cristina"},{k:"marcelo",n:"Marcelo"}];
var OP=null, OPPHOTOS={};
function opLoad(){try{OPPHOTOS=JSON.parse(localStorage.getItem("nvp_op_photos")||"{}");}catch(e){OPPHOTOS={};}var c=localStorage.getItem("nvp_op_cur");var d=OPS_DEF.filter(function(o){return o.k===c})[0];if(d)OP={k:d.k,n:d.n};}
function opAvHtml(k,n){var ph=OPPHOTOS[k];if(ph)return "<img src='"+ph+"' alt=''>";return esc((n||"?").slice(0,1).toUpperCase());}
function renderOpBar(){var el=document.getElementById("opbar");if(!el)return;if(OP){el.innerHTML="<div class='opav'>"+opAvHtml(OP.k,OP.n)+"</div><div class='opn'>Respondés como "+esc(OP.n)+"</div><div class='opc'>cambiar</div>";}else{el.innerHTML="<div class='opav'>NP</div><div class='opn'>Elegí quién sos para contestar</div><div class='opc'>elegir</div>";}}
function openOpModal(){var s=document.getElementById("opsheet");var h="<h3>¿Quién está contestando?</h3>";OPS_DEF.forEach(function(o){var sel=(OP&&OP.k===o.k)?" sel":"";h+="<div class='oprow"+sel+"' data-k='"+o.k+"'><div class='oav'>"+opAvHtml(o.k,o.n)+"</div><div class='onm'>"+esc(o.n)+"</div><button class='ofoto' data-foto='"+o.k+"'>📷 Foto</button><input type='file' accept='image/*' id='file_"+o.k+"' style='display:none'></div>";});h+="<button class='opclose' id='opCloseBtn'>Listo</button>";s.innerHTML=h;document.getElementById("opmodal").classList.add("open");
  OPS_DEF.forEach(function(o){
    var row=s.querySelector(".oprow[data-k='"+o.k+"']");
    var fbtn=s.querySelector(".ofoto[data-foto='"+o.k+"']");
    var finput=document.getElementById("file_"+o.k);
    row.addEventListener("click",function(ev){if(ev.target.classList.contains("ofoto"))return;OP={k:o.k,n:o.n};try{localStorage.setItem("nvp_op_cur",o.k);}catch(e){}renderOpBar();closeOpModal();toast("Ahora respondés como "+o.n);});
    fbtn.addEventListener("click",function(ev){ev.stopPropagation();finput.click();});
    finput.addEventListener("change",function(){var f=finput.files&&finput.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var cv=document.createElement("canvas");var S=96;cv.width=S;cv.height=S;var ctx=cv.getContext("2d");var m=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);OPPHOTOS[o.k]=cv.toDataURL("image/jpeg",0.82);try{localStorage.setItem("nvp_op_photos",JSON.stringify(OPPHOTOS));}catch(e){toast("No se pudo guardar la foto");}openOpModal();renderOpBar();};img.src=rd.result;};rd.readAsDataURL(f);});
  });
  document.getElementById("opCloseBtn").addEventListener("click",closeOpModal);
}
function closeOpModal(){document.getElementById("opmodal").classList.remove("open");}
var FLAGS={"Chile":"🇨🇱","Argentina":"🇦🇷","México":"🇲🇽","Mexico":"🇲🇽","Colombia":"🇨🇴","Perú":"🇵🇪","Peru":"🇵🇪","Costa Rica":"🇨🇷","Honduras":"🇭🇳","Guatemala":"🇬🇹","El Salvador":"🇸🇻"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1700)}
function initials(n){n=String(n||"?").trim();var d=n.replace(/[^0-9]/g,"");if(d.length>=2)return d.slice(-2);return n.slice(0,2).toUpperCase();}
function timeShort(iso){if(!iso)return "";try{var d=new Date(iso);return d.toLocaleString("es-CL",{timeZone:"America/Santiago",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).replace(",","");}catch(e){return ""}}
function chatById(id){if(!DATA)return null;for(var i=0;i<DATA.chats.length;i++)if(DATA.chats[i].id===id)return DATA.chats[i];return null;}
function visibles(){
  var chats=(DATA?DATA.chats:[]);
  return chats.filter(function(c){
    if(FILTER==="abiertas"&&c.cerrada)return false;
    if(FILTER==="cerradas"&&!c.cerrada)return false;
    if(!Q)return true;var q=Q.toLowerCase();
    if((c.nombre||"").toLowerCase().indexOf(q)>=0||(c.wa||"").indexOf(q)>=0)return true;
    return (c.msgs||[]).some(function(m){return (m.texto||"").toLowerCase().indexOf(q)>=0});
  });
}
function renderList(){
  var el=document.getElementById("items");
  var chats=visibles();
  var h="";
  chats.forEach(function(c){
    if(c.id===CONFIRMROW && !c.cerrada){
      h+="<div class='it confirmrow' data-id='"+c.id+"'><div class='rowconfirm'><span class='rcq'>¿Cerrar esta conversación?</span><button class='rcbtn yes'>Sí</button><button class='rcbtn no'>No</button></div></div>";
      return;
    }
    var sel=c.id===SEL?" sel":"";
    var cc=c.cerrada?" cerrada":"";
    var crm=c.crm||{};
    var fl=FLAGS[crm.pais||""]||"";
    var pb=c.pausada&&!c.cerrada?"<span class='badge b-paus'>Pausado</span>":"";
    var cb=c.cerrada?"<span class='badge b-cerr'>Cerrada</span>":"";
    h+="<div class='it"+sel+cc+"' data-id='"+c.id+"'><div class='av'>"+esc(initials(c.nombre))+"</div><div class='mid'><div class='nm'>"+(fl?fl+" ":"")+esc(c.nombre)+" "+pb+cb+"</div><div class='pv'>"+esc(c.prev||"")+"</div></div><div class='tm'>"+timeShort(c.ult)+"</div></div>";
  });
  el.innerHTML=h||"<div class='note' style='padding:20px'>Sin conversaciones en esta vista.</div>";
  [].forEach.call(el.querySelectorAll(".it"),function(n){
    var id=n.getAttribute("data-id");
    if(n.classList.contains("confirmrow")){
      var yb=n.querySelector(".yes"), nb=n.querySelector(".no");
      if(yb)yb.addEventListener("click",function(e){e.stopPropagation();CONFIRMROW=null;var c=chatById(id);if(c)cerrarChat(c);});
      if(nb)nb.addEventListener("click",function(e){e.stopPropagation();CONFIRMROW=null;render();});
      return;
    }
    n.addEventListener("click",function(){
      if(CLICKT){clearTimeout(CLICKT);CLICKT=null;}
      CLICKT=setTimeout(function(){CLICKT=null;SEL=id;CONFIRMROW=null;document.body.classList.add("chatopen");render();},220);
    });
    n.addEventListener("dblclick",function(){
      if(CLICKT){clearTimeout(CLICKT);CLICKT=null;}
      var c=chatById(id);if(c&&!c.cerrada){CONFIRMROW=id;render();}
    });
  });
}
function crmCard(c){
  var crm=c.crm||{};
  var fl=FLAGS[crm.pais||""]||"";
  var chips="";
  if(crm.etapa)chips+="<span class='chip etapa'>"+esc(crm.etapa)+"</span>";
  if(crm.estado){var cl="";var e=crm.estado.toLowerCase();if(/abandono|error|no cliente|perdido/.test(e))cl=" bad";else if(/7d|15d|contactad|registrad|capacitar/.test(e))cl=" warn";chips+="<span class='chip estado"+cl+"'>"+esc(crm.estado)+"</span>";}
  if(crm.material)chips+="<span class='chip mat'>"+esc(crm.material)+"</span>";
  if(crm.dias!=null)chips+="<span class='chip dias'>"+crm.dias+"d sin cotizar</span>";
  var meta=[];
  var coti=[];if(crm.cotiCN!=null)coti.push(crm.cotiCN+" c/nombre");if(crm.cotiSN!=null)coti.push(crm.cotiSN+" s/nombre");
  if(coti.length)meta.push("📐 "+coti.join(" · "));
  if(crm.correo)meta.push("✉️ <a href='mailto:"+esc(crm.correo)+"'>"+esc(crm.correo)+"</a>");
  if(crm.rut)meta.push("🪪 "+esc(crm.rut));
  if(c.empresa)meta.push("🏢 "+esc(c.empresa));
  if(crm.fAct)meta.push("📅 activó "+esc(crm.fAct));

// Reinyecta respuestas manuales recién enviadas que aún no están persistidas (evita parpadeo).
function mergeOutbox(){
  if(!DATA||!OUTBOX.length)return;
  var now=Date.now();
  OUTBOX=OUTBOX.filter(function(o){return now-o.at<120000;});
  OUTBOX.forEach(function(o){
    var wa=String(o.wa||"").replace(/[^0-9]/g,"");
    for(var i=0;i<DATA.chats.length;i++){
      var c=DATA.chats[i];
      if(String(c.wa||"").replace(/[^0-9]/g,"")===wa){
        var has=(c.msgs||[]).some(function(m){return (m.texto||"").indexOf(o.core)>=0 && String(m.quien||"").indexOf("agente")>=0;});
        if(!has){c.msgs=c.msgs||[];c.msgs.push({ts:o.ts,quien:"agente-manual",texto:o.texto});c.ult=new Date().toISOString();}

// Refresco disparado por un evento SSE (no por temporizador). Preserva scroll y lo que estás escribiendo.
function refreshData(){
  var th=document.getElementById("thread");var atBottom=th?(th.scrollTop+th.clientHeight>=th.scrollHeight-40):true;
  var ta=document.getElementById("ta");var typing=ta&&document.activeElement===ta&&ta.value;
  if(typing)return;
  fetch(STATE_URL+"?v="+Date.now()).then(function(r){return r.json()}).then(function(d){

  }).catch(function(){});
}
// Conexión en tiempo real. El panel NO refresca por reloj: solo cuando el server empuja un evento.
function connectSSE(){
  if(!window.EventSource){setInterval(refreshData,8000);liveSet(false);return;}
  var es=new EventSource("/stream");
  es.onopen=function(){liveSet(true);};
  es.onmessage=function(){liveSet(true);refreshData();};
  es.onerror=function(){liveSet(false);}; // EventSource reconecta solo
}

<script>/* NVSEND v1 - enviar imagenes/videos */
(function(){
if(window.__NVSEND)return; window.__NVSEND=true;
var TENANT=(location.host.indexOf('paneltp')>=0||location.host.indexOf('teampardo')>=0)?'teampardo':'nuvera';
var API='https://n8n.entrenemos.cl/webhook/conversacion-responder-media';
function curChat(){ try{ return window.chatById(window.SEL); }catch(e){ return null; } }
function toB64(file,cb){ var r=new FileReader(); r.onload=function(){ cb(String(r.result).replace(/^data:[^,]*,/,'')); }; r.readAsDataURL(file); }
function kindOf(f){ var t=(f.type||''); if(t.indexOf('image')===0)return 'image'; if(t.indexOf('video')===0)return 'video'; if(t.indexOf('audio')===0)return 'audio'; return 'document'; }
function extOf(f){ var n=(f.name||''); var m=n.match(/.([a-z0-9]+)$/i); if(m)return m[1].toLowerCase(); return (f.type||'').split('/')[1]||'bin'; }
function send(file){ var c=curChat(); if(!c){ alert('Elegí una conversación primero'); return; } var to=String(c.wa||'').replace(/D/g,''); if(!to){ alert('Esta conversación no tiene número'); return; } if(file.size>16000000){ alert('Máximo 16 MB'); return; } var st=document.getElementById('nvsend-st'); if(st){st.style.color='#64748b';st.textContent='Enviando…';} toB64(file,function(b64){ var body={ tenant:TENANT, to:to, pageId:String(c.id||''), kind:kindOf(file), ext:extOf(file), mime:file.type||'', caption:'', data_b64:b64 }; fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){ if(st){ st.style.color=(j&&j.ok)?'#16a34a':'#dc2626'; st.textContent=(j&&j.ok)?'✓ Enviado':'Error al enviar'; } setTimeout(function(){try{if(typeof window.render==='function')window.render();}catch(e){}},700); setTimeout(function(){if(st)st.textContent='';},2500); }).catch(function(){ if(st){st.style.color='#dc2626';st.textContent='Error de red';} }); }); }
function mount(){ var comp=document.querySelector('.composer'); if(!comp) return; if(comp.querySelector('.nvsend-btn')) return; var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*,video/*'; inp.style.display='none'; inp.className='nvsend-inp'; inp.addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; if(f)send(f); e.target.value=''; }); var btn=document.createElement('button'); btn.type='button'; btn.className='nvsend-btn'; btn.title='Adjuntar imagen o video'; btn.textContent='📎'; btn.style.cssText='border:none;background:transparent;font-size:20px;cursor:pointer;padding:2px 6px;line-height:1'; btn.addEventListener('click',function(){ inp.click(); }); var st=document.createElement('span'); st.id='nvsend-st'; st.style.cssText='font-size:11px;color:#16a34a'; comp.insertBefore(st,comp.firstChild); comp.insertBefore(btn,comp.firstChild); comp.insertBefore(inp,comp.firstChild); }
if(typeof window.render==='function'){ var _r=window.render; window.render=function(){var o=_r.apply(this,arguments); try{mount();}catch(e){} return o;}; }
setInterval(function(){try{mount();}catch(e){}},1500);
})();
</script>
<script>/* NVVOICE v1 - grabar y enviar nota de voz */
(function(){
if(window.__NVVOICE)return; window.__NVVOICE=true;
var TENANT=(location.host.indexOf('paneltp')>=0||location.host.indexOf('teampardo')>=0)?'teampardo':'nuvera';
var API='https://n8n.entrenemos.cl/webhook/conversacion-responder-media';
var rec=null, chunks=[], recording=false;
function curChat(){ try{ return window.chatById(window.SEL); }catch(e){ return null; } }
function setBtn(b,on){ b.textContent=on?'⏹':'🎤'; b.style.color=on?'#dc2626':''; b.title=on?'Detener y enviar':'Grabar nota de voz'; }
function sendBlob(blob){ var c=curChat(); if(!c){ alert('Elegí una conversación'); return; } var to=String(c.wa||'').replace(/D/g,''); if(!to){ alert('Sin número'); return; } var st=document.getElementById('nvvoice-st'); if(st){st.style.color='#64748b';st.textContent='Enviando…';} var r=new FileReader(); r.onload=function(){ var b64=String(r.result).replace(/^data:[^,]*,/,''); fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant:TENANT,to:to,pageId:String(c.id||''),kind:'audio',is_voice:true,ext:'webm',mime:'audio/webm',data_b64:b64})}).then(function(r){return r.json();}).then(function(j){ if(st){st.style.color=(j&&j.ok)?'#16a34a':'#dc2626';st.textContent=(j&&j.ok)?'✓ Enviado':'Error';} setTimeout(function(){try{if(typeof window.render==='function')window.render();}catch(e){}},900); setTimeout(function(){if(st)st.textContent='';},2600); }).catch(function(){ if(st){st.style.color='#dc2626';st.textContent='Error de red';} }); }; r.readAsDataURL(blob); }
function toggle(btn){ if(recording){ try{ rec.stop(); }catch(e){} return; } if(!navigator.mediaDevices||!window.MediaRecorder){ alert('Tu navegador no soporta grabación'); return; } navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ chunks=[]; var mt=''; try{ if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))mt='audio/webm;codecs=opus'; else if(MediaRecorder.isTypeSupported('audio/webm'))mt='audio/webm'; else if(MediaRecorder.isTypeSupported('audio/mp4'))mt='audio/mp4'; }catch(e){} rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream); rec.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); }; rec.onstop=function(){ recording=false; setBtn(btn,false); try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} var blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||'audio/webm'}); if(blob.size>0)sendBlob(blob); }; rec.start(); recording=true; setBtn(btn,true); }).catch(function(){ alert('No pude acceder al micrófono'); }); }
function mount(){ var comp=document.querySelector('.composer'); if(!comp) return; if(comp.querySelector('.nvvoice-btn')) return; var btn=document.createElement('button'); btn.type='button'; btn.className='nvvoice-btn'; setBtn(btn,false); btn.style.cssText='border:none;background:transparent;font-size:19px;cursor:pointer;padding:2px 6px;line-height:1'; btn.addEventListener('click',function(){ toggle(btn); }); var st=document.createElement('span'); st.id='nvvoice-st'; st.style.cssText='font-size:11px;color:#16a34a'; comp.insertBefore(st,comp.firstChild); comp.insertBefore(btn,comp.firstChild); }
if(typeof window.render==='function'){ var _r=window.render; window.render=function(){var o=_r.apply(this,arguments); try{mount();}catch(e){} return o;}; }
setInterval(function(){try{mount();}catch(e){}},1500);
})();
</script>
