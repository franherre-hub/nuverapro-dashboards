<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tickets — NuveraPRO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F4F2EC;--surf:#FFFFFF;--surf2:#EDEAE2;--line:#DAD5C9;--ink:#1B1A17;--mute:#6E6A60;--faint:#9C978B;--gold:#B8860B;--gold-soft:#F3E7C6;--ok:#2E8B57;--ok-soft:#DDF0E3;--warn:#D97706;--warn-soft:#FBE8CC;--bad:#C43D3D;--bad-soft:#F7DADA;--info:#2F6FCC;--info-soft:#DCE7FA;--sheet-shadow:0 -12px 40px rgba(0,0,0,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;text-wrap:balance;margin:0}
.app{max-width:1280px;margin:0 auto;min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .tag{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.note{font-size:12px;color:var(--faint)}
.seg{display:flex;gap:4px;background:var(--surf2);padding:3px;border-radius:10px;margin-top:8px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button[aria-selected="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px 0}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi .v{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700;line-height:1.1}
.kpi .l{font-size:11px;color:var(--mute);margin-top:2px}
.main{display:grid;grid-template-columns:1fr;padding:10px 14px 90px}
.main>div{min-width:0}
.view{display:none}.view.on{display:block}
.group{margin-top:14px}
.group>header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;gap:8px}
.group>header h2{font-size:14px;font-weight:700}
.group>header .why{font-size:12px;color:var(--mute);text-align:right}
.cards{display:grid;gap:8px}
.card{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 10px;text-align:left;width:100%}
.dchip{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--surf2);font-family:"IBM Plex Mono",monospace;font-size:10px;line-height:1.1;color:var(--mute);text-align:center;padding:2px}
.who{min-width:0}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{font-size:12.5px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.mute{background:var(--surf2);color:var(--mute)}
.quick{display:flex;gap:6px}
.quick a{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--surf2);color:var(--ink);text-decoration:none;font-size:16px}
.quick a.call{background:var(--gold-soft);color:var(--gold)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);text-align:center;font-size:13.5px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.col{background:var(--surf2);border-radius:12px;padding:8px;min-height:140px}
.col h3{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;padding:0 2px}
.col h3 small{color:var(--mute);font-weight:500}
.tile{display:grid;grid-template-columns:4px 1fr;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:7px 8px 7px 0;margin-bottom:6px;width:100%;text-align:left;overflow:hidden}
.tile i{display:block;border-radius:0 3px 3px 0;background:var(--faint)}
.tile i.info{background:var(--info)} .tile i.warn{background:var(--warn)} .tile i.ok{background:var(--ok)}
.tile .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .m{font-size:11px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
[draggable="true"]{cursor:grab}
[draggable="true"].dragging{opacity:.4}
.cards.dragover,.col.dragover{outline:2px dashed var(--gold);outline-offset:2px;background:var(--gold-soft)}
.fab{position:fixed;right:18px;bottom:18px;z-index:15;background:var(--ink);color:var(--bg);border-radius:999px;padding:14px 20px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
/* ficha / modal (bottom-sheet móvil, panel lateral desktop) */
.ficha{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:92vh;overflow:auto;background:var(--surf);border-radius:18px 18px 0 0;box-shadow:var(--sheet-shadow);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 16px 28px}
.ficha.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29;display:none}
.scrim.on{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.fh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fh h2{font-size:20px;font-weight:700}
.fh .sub{font-size:13px;color:var(--mute);margin-top:2px}
.close{width:34px;height:34px;border-radius:9px;background:var(--surf2);font-size:18px;line-height:1;flex:0 0 auto}
.sec{margin-top:16px}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px}
.facts div span{display:block;font-size:11px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea,input,select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);padding:9px 10px;font:inherit;resize:vertical;box-sizing:border-box}
textarea{min-height:70px}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:600}
.save{margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
.save button{padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600}
.save button.ghost{background:var(--surf2);color:var(--ink)}
.notesbox{white-space:pre-wrap;font-size:12.5px;color:var(--mute);line-height:1.5;max-height:220px;overflow:auto;background:var(--surf2);border-radius:10px;padding:10px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:480px){.top .note{display:none}.app .kpis{grid-template-columns:1fr 1fr}}
@media (min-width:700px){.top{padding:12px 20px 10px}.kpis{padding:12px 20px 0}.main{padding:12px 20px 90px}.seg{max-width:420px}.cards{grid-template-columns:1fr 1fr}}
@media (min-width:1040px){.ficha{position:fixed;top:0;right:0;bottom:0;left:auto;width:min(460px,100%);border-radius:0;box-shadow:-8px 0 30px rgba(0,0,0,.2)}}
@media (prefers-reduced-motion:reduce){.ficha{transition:none}}
</style></head><body>
<div class="app">
  <header class="top">
    <div class="row"><div class="brand"><h1>Tickets</h1><span class="tag">NuveraPRO · Team Pardo</span></div><span class="note mono" id="gen">cargando…</span></div>
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="true" data-view="hoy">Hoy <span class="n" id="nHoy">–</span></button>
      <button role="tab" aria-selected="false" data-view="tablero">Tablero</button>
    </div>
  </header>
  <section class="kpis" aria-label="Resumen">
    <div class="kpi"><div class="v mono" id="kTotal">–</div><div class="l">total</div></div>
    <div class="kpi"><div class="v mono" id="kNuevo">–</div><div class="l">nuevo</div></div>
    <div class="kpi"><div class="v mono" id="kCurso">–</div><div class="l">en curso</div></div>
    <div class="kpi"><div class="v mono" id="kResuelto">–</div><div class="l">resuelto</div></div>
  </section>
  <main class="main">
    <div>
      <section class="view on" id="v-hoy">
        <div class="group"><header><h2>Francisco</h2></header><div class="cards" id="cFrancisco" data-asignado="francisco"></div></div>
        <div class="group"><header><h2>Matías</h2></header><div class="cards" id="cMatias" data-asignado="matias"></div></div>
        <div class="group"><header><h2>Cristina</h2></header><div class="cards" id="cCristina" data-asignado="cristina"></div></div>
        <div class="group"><header><h2>Marcelo</h2></header><div class="cards" id="cMarcelo" data-asignado="marcelo"></div></div>
        <div class="group"><header><h2>Sin asignar</h2></header><div class="cards" id="cSinAsignar"></div></div>
      </section>
      <section class="view" id="v-tablero">
        <div class="board" id="board"></div>
      </section>
    </div>
  </main>
</div>

<button class="fab" id="btnNuevo">🎫 Nuevo ticket</button>

<aside class="ficha" id="ficha" aria-label="Ficha del ticket">
  <div class="grab"></div>
  <div class="fh"><div><h2 id="fNumero">—</h2><div class="sub" id="fSub"></div></div><button class="close" id="fClose" aria-label="Cerrar">×</button></div>
  <div class="sec"><h3>Detalle</h3><div class="facts" id="fFacts"></div></div>
  <div class="sec"><h3>Estado</h3><div class="chips" id="fEstadoChips">
    <button class="chip" data-e="nuevo">Nuevo</button>
    <button class="chip" data-e="en_curso">En curso</button>
    <button class="chip" data-e="resuelto">Resuelto</button>
  </div></div>
  <div class="sec"><h3>Asignado</h3><div class="chips" id="fAsigChips">
    <button class="chip" data-a="francisco">Francisco</button>
    <button class="chip" data-a="matias">Matías</button>
    <button class="chip" data-a="cristina">Cristina</button>
    <button class="chip" data-a="marcelo">Marcelo</button>
  </div></div>
  <div class="sec"><h3>Descripción / historial</h3><div class="notesbox" id="fDescripcion"></div>
    <label class="f">Agregar nota</label>
    <textarea id="fNota" placeholder="Qué se hizo, qué falta…"></textarea>
    <div class="save"><button id="fGuardarNota">Guardar nota</button></div>
  </div>
</aside>

<aside class="ficha" id="modalNuevo" aria-label="Nuevo ticket">
  <div class="grab"></div>
  <div class="fh"><div><h2>🎫 Nuevo ticket</h2><div class="sub">Se numera solo al guardar</div></div><button class="close" id="mClose" aria-label="Cerrar">×</button></div>
  <label class="f">Negocio</label>
  <select id="nTenant"><option value="nuvera">NuveraPRO (NV)</option><option value="teampardo">Team Pardo (TP)</option></select>
  <label class="f">Cliente</label>
  <input id="nCliente" placeholder="Nombre del cliente">
  <label class="f">Teléfono</label>
  <input id="nTelefono" placeholder="+56 9 …">
  <label class="f">Asignado</label>
  <select id="nAsignado"><option value="francisco">Francisco</option><option value="matias">Matías</option><option value="cristina">Cristina</option><option value="marcelo">Marcelo</option></select>
  <label class="f">Tarea</label>
  <input id="nTarea" placeholder="Qué hay que hacer, en pocas palabras">
  <label class="f">Descripción</label>
  <textarea id="nDescripcion" placeholder="Contexto, detalle…"></textarea>
  <label class="f">Adjunto (link — subida directa vía NVSEND, pendiente)</label>
  <input id="nAdjunto" placeholder="https://…">
  <div class="save"><button class="ghost" id="nCancelar">Cancelar</button><button id="nGuardar">Crear ticket</button></div>
</aside>

<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<script>
var JSON_URL_A="tickets.json", JSON_URL_B="data/tickets.json";
var CREAR_WEBHOOK="https://n8n.entrenemos.cl/webhook/crear-ticket";
var ACTUALIZAR_WEBHOOK="https://n8n.entrenemos.cl/webhook/actualizar-ticket";
var DATA=null, cur=null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},2200)}
function fmtISO(iso){if(!iso)return "";var d=new Date(iso);if(isNaN(d))return String(iso).slice(0,10);return d.toLocaleDateString("es-CL",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"America/Santiago"})}
var tenantPill={nuvera:'<span class="pill info">NV</span>',teampardo:'<span class="pill gold">TP</span>'};
var estadoPill={nuevo:'<span class="pill info">Nuevo</span>',en_curso:'<span class="pill warn">En curso</span>',resuelto:'<span class="pill ok">Resuelto</span>'};
var estadoTile={nuevo:"info",en_curso:"warn",resuelto:"ok"};

function card(t){
  return '<button class="card" data-id="'+esc(t.numero)+'" draggable="true">'
    +'<span class="dchip"><b>'+esc(t.numero)+'</b></span>'
    +'<span class="who"><span class="n">'+esc(t.tarea||t.cliente_nombre||"(sin tarea)")+'</span>'
    +'<span class="s">'+(tenantPill[t.tenant]||'<span class="pill mute">'+esc(t.tenant)+'</span>')+' '+(estadoPill[t.estado]||"")+(t.cliente_nombre?' <span class="pill mute">'+esc(t.cliente_nombre)+'</span>':'')+'</span></span>'
    +'<span class="quick">'+(t.cliente_telefono?'<a class="call" href="tel:'+esc(t.cliente_telefono)+'" aria-label="Llamar" onclick="event.stopPropagation()">📞</a><a href="https://wa.me/'+esc(t.cliente_telefono.replace(/[^0-9]/g,""))+'" target="_blank" rel="noopener" aria-label="WhatsApp" onclick="event.stopPropagation()">💬</a>':'')+'</span>'
    +'</button>';
}
function tile(t){
  return '<button class="tile" data-id="'+esc(t.numero)+'" draggable="true"><i class="'+(estadoTile[t.estado]||"")+'"></i>'
    +'<span><span class="n">'+esc(t.numero)+' · '+esc(t.tarea||t.cliente_nombre||"")+'</span>'
    +'<span class="m"><span>'+(tenantPill[t.tenant]||esc(t.tenant))+' '+esc(t.asignado||"sin asignar")+'</span><span class="mono">'+fmtISO(t.fecha_actualizacion||t.fecha_creacion)+'</span></span></span></button>';
}
function renderHoy(){
  var h=(DATA&&DATA.hoy)||{francisco:[],matias:[],cristina:[],marcelo:[],sin_asignar:[]};
  $("cFrancisco").innerHTML=(h.francisco||[]).length?h.francisco.map(card).join(""):'<div class="empty">Nada pendiente.</div>';
  $("cMatias").innerHTML=(h.matias||[]).length?h.matias.map(card).join(""):'<div class="empty">Nada pendiente.</div>';
  $("cCristina").innerHTML=(h.cristina||[]).length?h.cristina.map(card).join(""):'<div class="empty">Nada pendiente.</div>';
  $("cMarcelo").innerHTML=(h.marcelo||[]).length?h.marcelo.map(card).join(""):'<div class="empty">Nada pendiente.</div>';
  $("cSinAsignar").innerHTML=(h.sin_asignar||[]).length?h.sin_asignar.map(card).join(""):'<div class="empty">Nada pendiente.</div>';
  $("nHoy").textContent=(h.francisco||[]).length+(h.matias||[]).length+(h.cristina||[]).length+(h.marcelo||[]).length+(h.sin_asignar||[]).length;
}
function renderTablero(){
  var t=(DATA&&DATA.tablero)||{nuevo:[],en_curso:[],resuelto:[]};
  var cols=[["nuevo","Nuevo"],["en_curso","En curso"],["resuelto","Resuelto"]];
  $("board").innerHTML=cols.map(function(c){var items=t[c[0]]||[];
    return '<div class="col" data-estado="'+c[0]+'"><h3>'+c[1]+' <small>'+items.length+'</small></h3>'+(items.length?items.map(tile).join(""):'<div class="empty">Vacío.</div>')+'</div>';
  }).join("");
}
function renderKpis(){
  var k=(DATA&&DATA.kpis)||{};
  $("kTotal").textContent=k.total!=null?k.total:"–";
  $("kNuevo").textContent=k.nuevo!=null?k.nuevo:"–";
  $("kCurso").textContent=k.en_curso!=null?k.en_curso:"–";
  $("kResuelto").textContent=k.resuelto!=null?k.resuelto:"–";
  $("gen").textContent=DATA&&DATA.generated_at?"actualizado "+fmtISO(DATA.generated_at):"";
}
function renderAll(){renderKpis();renderHoy();renderTablero();}

function findTicket(numero){return (DATA&&DATA.tickets||[]).find(function(t){return t.numero===numero})}
function openFicha(numero){
  var t=findTicket(numero);if(!t)return;cur=t;
  $("fNumero").textContent=t.numero;
  $("fSub").innerHTML=(tenantPill[t.tenant]||esc(t.tenant))+" · creado "+fmtISO(t.fecha_creacion)+(t.creado_por?" · "+esc(t.creado_por):"");
  $("fFacts").innerHTML='<div><span>Cliente</span>'+esc(t.cliente_nombre||"—")+'</div><div><span>Teléfono</span>'+(t.cliente_telefono?'<a href="tel:'+esc(t.cliente_telefono)+'">'+esc(t.cliente_telefono)+'</a>':"—")+'</div><div><span>Tarea</span>'+esc(t.tarea||"—")+'</div><div><span>Adjuntos</span>'+(t.adjuntos?t.adjuntos.split(",").map(function(u){return '<a href="'+esc(u.trim())+'" target="_blank" rel="noopener">link</a>'}).join(" · "):"—")+'</div>';
  [].forEach.call(document.querySelectorAll("#fEstadoChips .chip"),function(c){c.classList.toggle("on",c.getAttribute("data-e")===t.estado)});
  [].forEach.call(document.querySelectorAll("#fAsigChips .chip"),function(c){c.classList.toggle("on",c.getAttribute("data-a")===(t.asignado||"").toLowerCase())});
  $("fDescripcion").textContent=t.descripcion||"Sin descripción.";
  $("fNota").value="";
  $("ficha").classList.add("open");$("scrim").classList.add("on");
}
function closeFicha(){$("ficha").classList.remove("open");if(!$("modalNuevo").classList.contains("open"))$("scrim").classList.remove("on")}
document.addEventListener("click",function(e){var b=e.target.closest("[data-id]");if(b&&!e.target.closest("#modalNuevo"))openFicha(b.getAttribute("data-id"))});
$("fClose").onclick=closeFicha;
$("scrim").onclick=function(){closeFicha();closeModal()};

function actualizarTicket(payload,cb){
  fetch(ACTUALIZAR_WEBHOOK,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)})
  .then(function(r){return r.json().catch(function(){return {ok:r.ok}})})
  .then(function(j){cb&&cb(j&&j.ok,j)}).catch(function(){cb&&cb(false)});
}
[].forEach.call(document.querySelectorAll("#fEstadoChips .chip"),function(c){c.onclick=function(){
  if(!cur)return;var e=c.getAttribute("data-e");
  actualizarTicket({numero:cur.numero,estado:e},function(ok){
    toast(ok?"Estado actualizado":"No se pudo actualizar");
    if(ok){cur.estado=e;[].forEach.call(document.querySelectorAll("#fEstadoChips .chip"),function(x){x.classList.toggle("on",x===c)});load(true);}
  });
};});
[].forEach.call(document.querySelectorAll("#fAsigChips .chip"),function(c){c.onclick=function(){
  if(!cur)return;var a=c.getAttribute("data-a");
  actualizarTicket({numero:cur.numero,asignado:a},function(ok){
    toast(ok?"Asignado actualizado":"No se pudo actualizar");
    if(ok){cur.asignado=a;[].forEach.call(document.querySelectorAll("#fAsigChips .chip"),function(x){x.classList.toggle("on",x===c)});load(true);}
  });
};});
$("fGuardarNota").onclick=function(){
  if(!cur)return;var nota=$("fNota").value.trim();if(!nota){toast("Escribe una nota primero");return}
  actualizarTicket({numero:cur.numero,nota:nota},function(ok){
    toast(ok?"Nota guardada":"No se pudo guardar");
    if(ok){$("fNota").value="";load(true,function(){openFicha(cur.numero)});}
  });
};

/* ---- crear ticket ---- */
function openModal(){$("modalNuevo").classList.add("open");$("scrim").classList.add("on");}
function closeModal(){$("modalNuevo").classList.remove("open");if(!$("ficha").classList.contains("open"))$("scrim").classList.remove("on")}
$("btnNuevo").onclick=openModal;
$("mClose").onclick=closeModal;
$("nCancelar").onclick=closeModal;
$("nGuardar").onclick=function(){
  var payload={
    tenant:$("nTenant").value,
    cliente_nombre:$("nCliente").value.trim(),
    cliente_telefono:$("nTelefono").value.trim(),
    asignado:$("nAsignado").value,
    tarea:$("nTarea").value.trim(),
    descripcion:$("nDescripcion").value.trim(),
    adjuntos:$("nAdjunto").value.trim(),
    creado_por:$("nAsignado").value
  };
  if(!payload.tarea){toast("Falta la tarea");return}
  var b=$("nGuardar");b.disabled=true;b.textContent="Creando…";
  fetch(CREAR_WEBHOOK,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)})
  .then(function(r){return r.json().catch(function(){return {ok:r.ok}})})
  .then(function(j){
    b.disabled=false;b.textContent="Crear ticket";
    if(j&&j.ok){toast("Ticket "+j.numero+" creado");closeModal();
      $("nCliente").value="";$("nTelefono").value="";$("nTarea").value="";$("nDescripcion").value="";$("nAdjunto").value="";
      setTimeout(function(){load(true)},1200);
    } else toast("Error: "+((j&&j.error)||"no se pudo crear"));
  }).catch(function(){b.disabled=false;b.textContent="Crear ticket";toast("Error de red")});
};

/* ---- pestañas ---- */
[].forEach.call(document.querySelectorAll(".seg button"),function(b){b.onclick=function(){
  [].forEach.call(document.querySelectorAll(".seg button"),function(x){x.setAttribute("aria-selected",x===b)});
  [].forEach.call(document.querySelectorAll(".view"),function(v){v.classList.toggle("on",v.id==="v-"+b.getAttribute("data-view"))});
};});

/* ---- arrastrar y soltar: reasignar (Hoy) o cambiar estado (Tablero) ---- */
var DRAGGED_ID=null;
document.addEventListener("dragstart",function(e){
  var el=e.target.closest('[draggable="true"]');if(!el)return;
  DRAGGED_ID=el.getAttribute("data-id");
  try{e.dataTransfer.setData("text/plain",DRAGGED_ID);}catch(err){}
  e.dataTransfer.effectAllowed="move";
  el.classList.add("dragging");
});
document.addEventListener("dragend",function(e){
  var el=e.target.closest('[draggable="true"]');if(el)el.classList.remove("dragging");
  document.querySelectorAll(".dragover").forEach(function(z){z.classList.remove("dragover")});
});
function dropZoneOf(e){return e.target.closest('.cards[data-asignado], .col[data-estado]')}
document.addEventListener("dragover",function(e){var dz=dropZoneOf(e);if(!dz)return;e.preventDefault();dz.classList.add("dragover")});
document.addEventListener("dragleave",function(e){var dz=dropZoneOf(e);if(dz&&!dz.contains(e.relatedTarget))dz.classList.remove("dragover")});
document.addEventListener("drop",function(e){
  var dz=dropZoneOf(e);if(!dz||!DRAGGED_ID)return;
  e.preventDefault();dz.classList.remove("dragover");
  var id=DRAGGED_ID;DRAGGED_ID=null;
  if(dz.hasAttribute("data-asignado")){
    var asig=dz.getAttribute("data-asignado");
    actualizarTicket({numero:id,asignado:asig},function(ok){toast(ok?"Reasignado":"No se pudo reasignar");if(ok)load(true);});
  } else if(dz.hasAttribute("data-estado")){
    var est=dz.getAttribute("data-estado");
    actualizarTicket({numero:id,estado:est},function(ok){toast(ok?"Estado actualizado":"No se pudo actualizar");if(ok)load(true);});
  }
});

/* ---- carga de datos ---- */
function load(silent,cb){
  var urls=[JSON_URL_A,JSON_URL_B];
  (function tryNext(i){if(i>=urls.length){if(!silent)$("gen").textContent="No se pudo cargar tickets.json";return}
    fetch(urls[i]+"?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DATA=d;renderAll();cb&&cb();}).catch(function(){tryNext(i+1)})})(0);
}
load();
setInterval(function(){if(!$("ficha").classList.contains("open")&&!$("modalNuevo").classList.contains("open"))load(true);},20000);
</script>
