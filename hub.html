<style>
  :root{
    --bg:#0d1117; --bar:#12233f; --bar2:#0f1b2e; --line:#22314a;
    --ink:#e6edf3; --muted:#9db0c7; --accent:#4f9dff; --live:#3fb950;
    --tabh:52px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none}
  /* ---- top bar ---- */
  #bar{position:fixed;top:0;left:0;right:0;height:var(--tabh);z-index:20;
    display:flex;align-items:stretch;gap:0;
    background:linear-gradient(180deg,var(--bar) 0%,var(--bar2) 100%);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #brand{display:flex;align-items:center;gap:7px;padding:0 12px;font-weight:700;
    font-size:14.5px;white-space:nowrap;border-right:1px solid var(--line)}
  #brand .live{width:8px;height:8px;border-radius:50%;background:var(--live);
    box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}
    70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  #tabs{display:flex;align-items:stretch;overflow-x:auto;flex:1;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tab{display:flex;align-items:center;gap:7px;padding:0 15px;cursor:pointer;
    color:var(--muted);font-size:13.5px;white-space:nowrap;border:none;background:none;
    border-bottom:3px solid transparent;transition:.15s;position:relative}
  .tab:hover{color:var(--ink)}
  .tab.active{color:#fff;border-bottom-color:var(--accent)}
  .tab .ic{font-size:16px;line-height:1}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--live);margin-left:1px}
  /* ---- panes ---- */
  #stage{position:fixed;top:var(--tabh);left:0;right:0;bottom:0;
    top:calc(var(--tabh) + env(safe-area-inset-top))}
  .pane{position:absolute;inset:0;display:none;background:var(--bg)}
  .pane.active{display:block}
  .pane iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;flex-direction:column;gap:10px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* narrow: colapsar etiquetas a solo íconos (excepto la activa) */
  @media(max-width:620px){
    #brand span.t{display:none}
    .tab span.t{display:none}
    .tab.active span.t{display:inline}
    .tab{padding:0 13px}
  }
#fichaDrawer{position:fixed;inset:0;z-index:9999;display:none}#fichaDrawer.on{display:block}#fichaDrawer .fd-scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}#fichaDrawer .fd-panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.35);display:flex;flex-direction:column}#fichaDrawer .fd-close{position:absolute;top:8px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#111;color:#fff;font-size:16px;cursor:pointer}#fichaDrawer .fd-frame{flex:1;width:100%;border:0}
</style>
</head>
<body>
  <div id="bar">
    <div id="brand"><span class="live"></span><span class="t">NuveraPRO</span></div>
    <div id="tabs"></div>
  </div>
  <div id="stage"></div>

<script>
/* ====== CONFIG ====== */
// Base de los dashboards que hornea n8n (GitHub Pages). Se siguen horneando allá;
// acá solo se embeben. Cambiar si algún día migran de host.
var GH = "https://franherre-hub.github.io/nuverapro-dashboards/";

// Chat en vivo: hoy vive en la RAÍZ del panel (index.html con SSE). Este shell se
// despliega como hub.html y lo embebe desde "/". Si algún día se promueve el shell a
// la raíz, mover el chat a chat.html y cambiar CHAT_URL a "/chat.html".
var CHAT_URL = "/";

var TABS = [
  // key,        label,           icon, url,                              eager (montar al abrir)
  ["conversaciones","Conversaciones","💬", CHAT_URL,                          true ],
  ["rendimiento-sem","Embudo",  "📅", "./rendimiento-semanal.html",     false],
  ["conversion",   "Conversión",    "📈", GH+"conversion.html",               false],
  ["trabajo",      "Trabajo",       "🗂️", GH+"vincular-capacitaciones.html",  false],
  ["antifraude",   "Antifraude",    "🚩", "./duplicados.html",               false],
  ["llamadas",     "Llamadas",      "📞", "./llamadas.html",                 false],
  ["procesos",     "Procesos",      "🗺️", "./procesos.html",                  false],
];

var tabsEl = document.getElementById('tabs');
var stage  = document.getElementById('stage');
var frames = {};   // key -> iframe (una vez montado, se mantiene vivo)
var panes  = {};   // key -> pane div
var loaded = {};   // key -> bool

function buildPane(key){
  var pane = document.createElement('div');
  pane.className='pane'; pane.dataset.key=key;
  var load=document.createElement('div'); load.className='loading';
  load.innerHTML='<div class="spin"></div><div>Cargando '+key+'…</div>';
  pane.appendChild(load);
  stage.appendChild(pane);
  panes[key]=pane;
  return pane;
}

function mount(key){
  if(loaded[key]) return;
  var def = TABS.find(function(t){return t[0]===key;});
  var f=document.createElement('iframe');
  f.setAttribute('title',def[1]);
  f.setAttribute('loading','eager');
  f.onload=function(){ var l=panes[key].querySelector('.loading'); if(l) l.remove(); };
  f.src=def[3];
  panes[key].appendChild(f);
  frames[key]=f; loaded[key]=true;
}

function activate(key){
  Object.keys(panes).forEach(function(k){ panes[k].classList.toggle('active', k===key); });
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.key===key); });
  mount(key); // monta al primer uso; luego queda vivo (no se recarga al cambiar de pestaña)
  try{ location.hash = key; }catch(e){}
}

/* construir barra + panes */
TABS.forEach(function(t){
  var key=t[0];
  var b=document.createElement('button');
  b.className='tab'; b.dataset.key=key;
  b.innerHTML='<span class="ic">'+t[2]+'</span><span class="t">'+t[1]+'</span>'
            + (key==='conversaciones' ? '<span class="dot" title="en vivo"></span>' : '');
  b.onclick=function(){ activate(key); };
  tabsEl.appendChild(b);
  buildPane(key);
  if(t[4]) mount(key);   // Conversaciones se monta YA → SSE conecta al instante y nunca se corta
});

/* pestaña inicial: hash válido o Conversaciones */
var start = (location.hash||'').replace('#','');
if(!TABS.find(function(t){return t[0]===start;})) start='conversaciones';
activate(start);

/* ===== Puente Llamadas → Conversaciones (postMessage, sin recargar el chat) =====
   La ficha de Llamadas hace postMessage {type:'openConv', wa} al shell.
   Reenviamos al iframe del chat (que ya escucha 'openConv') sin tocar su src → SSE intacto. */
window.addEventListener('message', function(ev){
  var d=ev.data||{};
  if(d && d.type==='openLead'){
    var q='embed=1&pageId='+encodeURIComponent(d.pageId||'')+'&wa='+encodeURIComponent(d.wa||'')+'&nombre='+encodeURIComponent(d.nombre||'')+'&correo='+encodeURIComponent(d.correo||'')+'&etapa='+encodeURIComponent(d.etapa||'')+'&estado='+encodeURIComponent(d.estado||'')+'&pais='+encodeURIComponent(d.pais||'');
    var dr=document.getElementById('fichaDrawer');
    if(!dr){dr=document.createElement('div');dr.id='fichaDrawer';dr.innerHTML='<div class="fd-scrim"></div><div class="fd-panel"><button class="fd-close" aria-label="Cerrar">✕</button><iframe class="fd-frame" title="Ficha"></iframe></div>';document.body.appendChild(dr);
      dr.querySelector('.fd-scrim').onclick=dr.querySelector('.fd-close').onclick=function(){dr.classList.remove('on');dr.querySelector('.fd-frame').src='about:blank';};}
    dr.querySelector('.fd-frame').src='./llamadas.html?'+q+'&v='+Date.now();
    dr.classList.add('on');
    return;
  }
  if(d && d.type==='closeFicha'){var dr2=document.getElementById('fichaDrawer');if(dr2){dr2.classList.remove('on');dr2.querySelector('.fd-frame').src='about:blank';}return;}
  if(d && d.type==='fichaNoLead'){var dr3=document.getElementById('fichaDrawer');if(dr3){dr3.classList.remove('on');dr3.querySelector('.fd-frame').src='about:blank';}return;}
  if(d && d.type==='openConv' && d.wa){
    activate('conversaciones');
    var f=frames['conversaciones'];
    if(f && f.contentWindow){
      try{ f.contentWindow.postMessage({type:'openConv', wa:d.wa}, '*'); }catch(e){}
    }
  }
});
</script>
</body>
